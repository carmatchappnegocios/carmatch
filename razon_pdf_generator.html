<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CarMatch — 1001 Razones | Generador de Documentales</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Inter:wght@300;400;500;600&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #C9A84C;
    --gold-light: #F0D080;
    --dark: #0D0D0D;
    --dark2: #1A1A1A;
    --red: #E63946;
    --white: #F5F0E8;
    --gray: #888;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #111;
    font-family: 'Inter', sans-serif;
    color: var(--white);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ===== CONTROL PANEL ===== */
  .panel {
    width: 100%;
    max-width: 900px;
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 16px;
    padding: 32px;
    margin: 32px auto 24px;
  }

  .panel h2 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    color: var(--gold);
    letter-spacing: 3px;
    margin-bottom: 24px;
  }

  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .field-full { grid-column: 1 / -1; }

  label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    color: var(--gray);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  input, textarea, select {
    width: 100%;
    background: #0d0d0d;
    border: 1px solid #333;
    border-radius: 8px;
    color: var(--white);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    padding: 12px 14px;
    outline: none;
    transition: border-color 0.2s;
  }

  input:focus, textarea:focus, select:focus { border-color: var(--gold); }
  textarea { resize: vertical; min-height: 100px; }

  .btn-generate {
    margin-top: 24px;
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, var(--gold), var(--gold-light));
    color: #000;
    border: none;
    border-radius: 10px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    letter-spacing: 3px;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
  }

  .btn-generate:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 32px rgba(201,168,76,0.4);
  }

  .btn-print {
    margin-top: 12px;
    width: 100%;
    padding: 14px;
    background: transparent;
    color: var(--gold);
    border: 1px solid var(--gold);
    border-radius: 10px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    letter-spacing: 3px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-print:hover { background: rgba(201,168,76,0.1); }

  /* ===== PDF PREVIEW ===== */
  .preview-wrapper {
    width: 100%;
    max-width: 900px;
    margin: 0 auto 60px;
  }

  .preview-label {
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--gray);
    text-transform: uppercase;
    margin-bottom: 12px;
    padding-left: 4px;
  }

  /* ===== PDF PAGES ===== */
  .pdf-doc {
    background: var(--white);
    color: var(--dark);
    width: 100%;
    font-family: 'Inter', sans-serif;
    border-radius: 4px;
    overflow: hidden;
    box-shadow: 0 24px 80px rgba(0,0,0,0.6);
  }

  /* PAGE 1 — COVER */
  .page-cover {
    min-height: 1122px;
    background: var(--dark);
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 60px;
    overflow: hidden;
  }

  .cover-bg-grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(201,168,76,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(201,168,76,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
  }

  .cover-accent {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--red), var(--gold), var(--gold-light));
  }

  .cover-top { position: relative; z-index: 2; }
  .cover-brand {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    letter-spacing: 6px;
    color: var(--gold);
    opacity: 0.7;
  }

  .cover-series {
    font-size: 11px;
    letter-spacing: 4px;
    color: var(--gray);
    text-transform: uppercase;
    margin-top: 6px;
  }

  .cover-center {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 40px 0;
  }

  .cover-number {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 160px;
    line-height: 1;
    color: transparent;
    -webkit-text-stroke: 1px rgba(201,168,76,0.2);
    letter-spacing: -4px;
    user-select: none;
    margin-bottom: -20px;
  }

  .cover-razón-label {
    font-size: 10px;
    letter-spacing: 8px;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 20px;
  }

  .cover-title {
    font-family: 'Playfair Display', serif;
    font-size: 52px;
    font-weight: 900;
    line-height: 1.1;
    color: var(--white);
    max-width: 680px;
    margin: 0 auto 24px;
  }

  .cover-subtitle {
    font-size: 16px;
    color: rgba(245,240,232,0.5);
    font-style: italic;
    max-width: 500px;
    margin: 0 auto;
    line-height: 1.6;
  }

  .cover-divider {
    width: 60px;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 28px auto;
  }

  .cover-bottom {
    position: relative;
    z-index: 2;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }

  .cover-tag {
    background: rgba(201,168,76,0.1);
    border: 1px solid rgba(201,168,76,0.3);
    color: var(--gold);
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    padding: 6px 14px;
    border-radius: 4px;
  }

  .cover-hashtag {
    font-size: 13px;
    color: rgba(245,240,232,0.3);
    font-style: italic;
  }

  /* PAGE 2 — NARRATIVE */
  .page-content {
    min-height: 1122px;
    background: var(--white);
    padding: 70px 80px;
    position: relative;
    color: var(--dark);
  }

  .page-content::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 4px;
    height: 100%;
    background: linear-gradient(180deg, var(--red), var(--gold));
  }

  .chapter-label {
    font-size: 9px;
    letter-spacing: 5px;
    color: var(--gold);
    text-transform: uppercase;
    font-weight: 600;
    margin-bottom: 8px;
  }

  .chapter-title {
    font-family: 'Playfair Display', serif;
    font-size: 36px;
    font-weight: 700;
    line-height: 1.2;
    color: var(--dark);
    margin-bottom: 32px;
    border-bottom: 1px solid #e0d8cc;
    padding-bottom: 24px;
  }

  .narrative-text {
    font-size: 15px;
    line-height: 1.85;
    color: #2a2a2a;
    margin-bottom: 24px;
    text-align: justify;
  }

  .pull-quote {
    border-left: 3px solid var(--gold);
    margin: 36px 0;
    padding: 16px 28px;
    background: rgba(201,168,76,0.05);
    border-radius: 0 8px 8px 0;
  }

  .pull-quote p {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    font-style: italic;
    line-height: 1.5;
    color: #1a1a1a;
  }

  .pull-quote cite {
    display: block;
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--gold);
    text-transform: uppercase;
    margin-top: 10px;
  }

  /* PAGE 3 — DATA + CARMATCH */
  .page-data {
    min-height: 1122px;
    background: #F9F6F0;
    padding: 70px 80px;
    position: relative;
  }

  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 24px;
    margin: 32px 0;
  }

  .stat-card {
    background: var(--dark);
    border-radius: 12px;
    padding: 28px 20px;
    text-align: center;
  }

  .stat-number {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 52px;
    color: var(--gold);
    line-height: 1;
    display: block;
  }

  .stat-label {
    font-size: 11px;
    color: rgba(245,240,232,0.6);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 8px;
    display: block;
  }

  .carmatch-section {
    background: var(--dark);
    border-radius: 16px;
    padding: 40px;
    margin-top: 40px;
    position: relative;
    overflow: hidden;
  }

  .carmatch-section::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--red), var(--gold));
  }

  .carmatch-label {
    font-size: 9px;
    letter-spacing: 5px;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .carmatch-title {
    font-family: 'Playfair Display', serif;
    font-size: 26px;
    color: var(--white);
    margin-bottom: 16px;
    line-height: 1.3;
  }

  .carmatch-text {
    font-size: 14px;
    line-height: 1.8;
    color: rgba(245,240,232,0.7);
  }

  .carmatch-cta {
    display: inline-block;
    margin-top: 24px;
    padding: 12px 28px;
    background: linear-gradient(135deg, var(--gold), var(--gold-light));
    color: #000;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 16px;
    letter-spacing: 3px;
    border-radius: 8px;
    text-decoration: none;
  }

  /* PAGE 4 — CIERRE */
  .page-close {
    min-height: 500px;
    background: var(--dark);
    padding: 70px 80px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
  }

  .close-bg {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, rgba(201,168,76,0.08) 0%, transparent 70%);
  }

  .close-next {
    position: relative;
    z-index: 2;
    text-align: center;
  }

  .close-label {
    font-size: 10px;
    letter-spacing: 5px;
    color: var(--gray);
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  .close-next-title {
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    font-style: italic;
    color: rgba(245,240,232,0.4);
    margin-bottom: 8px;
  }

  .close-footer {
    position: relative;
    z-index: 2;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid #2a2a2a;
    padding-top: 24px;
    margin-top: 40px;
  }

  .close-brand {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 4px;
    color: var(--gold);
  }

  .close-social {
    font-size: 12px;
    color: var(--gray);
    letter-spacing: 1px;
  }

  /* PRINT */
  @media print {
    body { background: white; }
    .panel, .preview-label, .btn-print, .btn-generate { display: none !important; }
    .preview-wrapper { max-width: 100%; margin: 0; }
    .pdf-doc { box-shadow: none; border-radius: 0; }
    .page-cover, .page-content, .page-data, .page-close {
      page-break-after: always;
      min-height: 100vh;
    }
  }
</style>
</head>
<body>

<!-- PANEL DE CONTROL -->
<div class="panel">
  <h2>⚡ GENERADOR — 1001 RAZONES CARMATCH</h2>
  <div class="fields">
    <div>
      <label>Número de Razón</label>
      <input type="number" id="f-num" value="1" min="1" max="1001">
    </div>
    <div>
      <label>Hashtag / Tagline</label>
      <input type="text" id="f-hash" value="#CarMatchMX">
    </div>
    <div class="field-full">
      <label>Título de la Razón</label>
      <input type="text" id="f-title" value="El carro dice más de ti que tu foto de perfil">
    </div>
    <div class="field-full">
      <label>Subtítulo / Gancho emocional</label>
      <input type="text" id="f-sub" value="Porque antes de enamorarte de una persona, ya te enamoraste de cómo vive.">
    </div>
    <div class="field-full">
      <label>Párrafo 1 — La Escena (pon al lector en el momento)</label>
      <textarea id="f-p1">Era un martes cualquiera. Ella había revisado cuarenta perfiles esa semana. Todos con la misma sonrisa de foto de playa, el mismo "me gusta el gym y los tacos". Ninguno le decía nada. Hasta que vio el carro. Un Golf GTI del 2019, perfectamente mantenido, con un par de stickers de bandas que ella conocía y quería olvidar que le gustaban. Algo hizo clic antes de leer siquiera el nombre del dueño.</textarea>
    </div>
    <div class="field-full">
      <label>Párrafo 2 — El Argumento / Revelación</label>
      <textarea id="f-p2">Los psicólogos de la Universidad de Michigan llevan años estudiando cómo las personas proyectan su identidad en sus posesiones. Y el carro, resulta ser el objeto más honesto que una persona tiene. No lo escoges en cinco minutos como una camisa. Lo pagas durante años. Lo mantienes, lo descuidas, lo personalizas o lo dejas exactamente como salió de la agencia. Cada decisión es un párrafo de tu autobiografía. CarMatch fue construida sobre esta idea: que el carro no es un medio de transporte. Es un lenguaje.</textarea>
    </div>
    <div class="field-full">
      <label>Cita / Pull Quote (frase poderosa)</label>
      <textarea id="f-quote" style="min-height:60px">Dime qué manejas y te diré cómo amas.</textarea>
    </div>
    <div>
      <label>Stat 1 (número)</label>
      <input type="text" id="s1n" value="78%">
    </div>
    <div>
      <label>Stat 1 (descripción)</label>
      <input type="text" id="s1d" value="de mujeres juzgan compatibilidad por el carro">
    </div>
    <div>
      <label>Stat 2 (número)</label>
      <input type="text" id="s2n" value="3.2x">
    </div>
    <div>
      <label>Stat 2 (descripción)</label>
      <input type="text" id="s2d" value="más matches cuando el auto es el elemento central">
    </div>
    <div>
      <label>Stat 3 (número)</label>
      <input type="text" id="s3n" value="92%">
    </div>
    <div>
      <label>Stat 3 (descripción)</label>
      <input type="text" id="s3d" value="dice que el carro refleja la personalidad real">
    </div>
    <div class="field-full">
      <label>Párrafo — Conexión con CarMatch</label>
      <textarea id="f-carmatch">Por eso CarMatch existe. Una app de citas donde el perfil empieza con tu carro. Sin filtros de cara, sin poses. Solo tú, tu vehículo, y la historia que ambos cuentan juntos. Porque la persona correcta no solo va a enamorarse de ti — va a enamorarse del mundo que construiste, y el carro es la puerta de entrada a ese mundo.</textarea>
    </div>
    <div class="field-full">
      <label>Título de la Siguiente Razón (para el cierre)</label>
      <input type="text" id="f-next" value="Razón #002: El sonido del motor también es un idioma">
    </div>
  </div>
  <button class="btn-generate" onclick="generatePDF()">⚡ GENERAR DOCUMENTAL</button>
  <button class="btn-print" onclick="window.print()">🖨️ EXPORTAR A PDF</button>
</div>

<!-- PREVIEW -->
<div class="preview-wrapper">
  <p class="preview-label">▶ VISTA PREVIA DEL DOCUMENTAL</p>
  <div class="pdf-doc" id="pdf-output">
    <!-- Se genera con JS -->
  </div>
</div>

<script>
function val(id) { return document.getElementById(id).value; }

function generatePDF() {
  const num = val('f-num').padStart(3,'0');
  const title = val('f-title');
  const sub = val('f-sub');
  const p1 = val('f-p1');
  const p2 = val('f-p2');
  const quote = val('f-quote');
  const hash = val('f-hash');
  const s1n = val('s1n'), s1d = val('s1d');
  const s2n = val('s2n'), s2d = val('s2d');
  const s3n = val('s3n'), s3d = val('s3d');
  const carmatch = val('f-carmatch');
  const next = val('f-next');

  document.getElementById('pdf-output').innerHTML = `

    <!-- PORTADA -->
    <div class="page-cover">
      <div class="cover-bg-grid"></div>
      <div class="cover-accent"></div>

      <div class="cover-top">
        <div class="cover-brand">CARMATCH</div>
        <div class="cover-series">Serie Documental · 1001 Razones</div>
      </div>

      <div class="cover-center">
        <div class="cover-number">${num}</div>
        <div class="cover-razón-label">Razón número ${parseInt(num)} de 1001</div>
        <div class="cover-title">${title}</div>
        <div class="cover-divider"></div>
        <div class="cover-subtitle">${sub}</div>
      </div>

      <div class="cover-bottom">
        <div class="cover-tag">📍 HISTORIA REAL · 2025</div>
        <div class="cover-hashtag">${hash} · #1001Razones</div>
      </div>
    </div>

    <!-- NARRATIVA -->
    <div class="page-content">
      <div class="chapter-label">Capítulo I · La Historia</div>
      <div class="chapter-title">${title}</div>
      <p class="narrative-text">${p1}</p>
      <div class="pull-quote">
        <p>"${quote}"</p>
        <cite>— 1001 Razones CarMatch · Razón ${parseInt(num)}</cite>
      </div>
      <p class="narrative-text">${p2}</p>
    </div>

    <!-- DATOS + CARMATCH -->
    <div class="page-data">
      <div class="chapter-label">Capítulo II · Los Datos</div>
      <div class="chapter-title" style="font-family:'Playfair Display',serif;font-size:32px;font-weight:700;color:#0d0d0d;border-bottom:1px solid #ddd;padding-bottom:20px;margin-bottom:0;">Lo que la ciencia dice</div>
      <div class="stats-grid">
        <div class="stat-card">
          <span class="stat-number">${s1n}</span>
          <span class="stat-label">${s1d}</span>
        </div>
        <div class="stat-card">
          <span class="stat-number">${s2n}</span>
          <span class="stat-label">${s2d}</span>
        </div>
        <div class="stat-card">
          <span class="stat-number">${s3n}</span>
          <span class="stat-label">${s3d}</span>
        </div>
      </div>
      <div class="carmatch-section">
        <div class="carmatch-label">Por eso existe CarMatch</div>
        <div class="carmatch-title">La primera app de citas donde el carro es el protagonista.</div>
        <p class="carmatch-text">${carmatch}</p>
        <span class="carmatch-cta">DESCARGA CARMATCH</span>
      </div>
    </div>

    <!-- CIERRE -->
    <div class="page-close">
      <div class="close-bg"></div>
      <div class="close-next">
        <div class="close-label">Continúa la serie · Próximo episodio</div>
        <div class="close-next-title">${next}</div>
      </div>
      <div class="close-footer">
        <div class="close-brand">CARMATCH</div>
        <div class="close-social">${hash} · #1001Razones · carmatch.app</div>
      </div>
    </div>

  `;
}

// Generar automáticamente al cargar
window.onload = generatePDF;
</script>
</body>
</html>
