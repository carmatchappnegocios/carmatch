<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="400" fill="#0f172a"/>
  
  <!-- Body - Navy Blue Jacket -->
  <path d="M120 200 Q120 180 140 170 L160 160 Q180 150 200 150 Q220 150 240 160 L260 170 Q280 180 280 200 L280 320 Q280 340 260 350 L140 350 Q120 340 120 320 Z" fill="#0f172a"/>
  
  <!-- Orange Logo on Jacket -->
  <circle cx="160" cy="220" r="15" fill="#FF6B2C"/>
  <path d="M152 220 L160 212 L168 220 L160 228 Z" fill="#0f172a"/>
  
  <!-- Head -->
  <ellipse cx="200" cy="120" rx="50" ry="55" fill="#C4A882"/>
  
  <!-- Hair - Black with gray temples -->
  <path d="M150 100 Q150 60 200 55 Q250 60 250 100 L250 90 Q250 70 200 65 Q150 70 150 90 Z" fill="#1a1a1a"/>
  <path d="M155 95 Q155 85 165 80 L155 95 Z" fill="#666"/>
  <path d="M245 95 Q245 85 235 80 L245 95 Z" fill="#666"/>
  
  <!-- Eyes -->
  <ellipse cx="180" cy="115" rx="8" ry="6" fill="#3d2914"/>
  <ellipse cx="220" cy="115" rx="8" ry="6" fill="#3d2914"/>
  <circle cx="182" cy="113" r="2" fill="#fff"/>
  <circle cx="222" cy="113" r="2" fill="#fff"/>
  
  <!-- Beard - 3 day stubble -->
  <path d="M170 135 Q170 155 200 160 Q230 155 230 135" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="2,2"/>
  
  <!-- Smile -->
  <path d="M175 140 Q200 160 225 140" fill="none" stroke="#3d2914" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Name -->
  <text x="200" y="380" font-family="Arial, sans-serif" font-size="24" fill="#FF6B2C" text-anchor="middle" font-weight="bold">DON MATCH</text>
  
  <!-- Age -->
  <text x="200" y="395" font-family="Arial, sans-serif" font-size="14" fill="#e2e8f0" text-anchor="middle">45 años</text>
</svg>