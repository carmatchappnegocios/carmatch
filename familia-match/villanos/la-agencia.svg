<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="400" fill="#1a1a2e"/>
  
  <!-- Body - Green suit -->
  <path d="M120 200 Q120 180 140 170 L160 160 Q180 150 200 150 Q220 150 240 160 L260 170 Q280 180 280 200 L280 320 Q280 340 260 350 L140 350 Q120 340 120 320 Z" fill="#166534"/>
  
  <!-- Money symbols -->
  <text x="160" y="250" font-family="Arial" font-size="24" fill="#fbbf24">$</text>
  <text x="220" y="230" font-family="Arial" font-size="20" fill="#fbbf24">$</text>
  <text x="190" y="280" font-family="Arial" font-size="18" fill="#fbbf24">$</text>
  
  <!-- Head -->
  <ellipse cx="200" cy="120" rx="50" ry="55" fill="#C4A882"/>
  
  <!-- Hair - Greasy slicked back -->
  <path d="M150 100 Q150 55 200 50 Q250 55 250 100 L250 85 Q250 65 200 60 Q150 65 150 85 Z" fill="#1a1a1a"/>
  
  <!-- Eyes - Sly -->
  <ellipse cx="180" cy="115" rx="8" ry="5" fill="#166534"/>
  <ellipse cx="220" cy="115" rx="8" ry="5" fill="#166534"/>
  
  <!-- Greedy smile -->
  <path d="M170 140 Q200 160 230 140" fill="#166534" stroke="#166534" stroke-width="2"/>
  <path d="M175 142 L225 142" fill="none" stroke="#fff" stroke-width="1"/>
  
  <text x="200" y="375" font-family="Arial, sans-serif" font-size="18" fill="#166534" text-anchor="middle" font-weight="bold">LA AGENCIA</text>
  <text x="200" y="395" font-family="Arial, sans-serif" font-size="12" fill="#a0aec0" text-anchor="middle">Don Comisión</text>
</svg>