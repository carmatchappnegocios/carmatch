<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="400" fill="#1a1a2e"/>
  
  <!-- Body - Gray dirty jacket -->
  <path d="M120 200 Q120 180 140 170 L160 160 Q180 150 200 150 Q220 150 240 160 L260 170 Q280 180 280 200 L280 320 Q280 340 260 350 L140 350 Q120 340 120 320 Z" fill="#4a5568"/>
  
  <!-- Pothole crack on jacket -->
  <path d="M160 220 L180 240 L170 260 L190 280" fill="none" stroke="#2d3748" stroke-width="3"/>
  
  <!-- Head -->
  <ellipse cx="200" cy="120" rx="50" ry="55" fill="#C4A882"/>
  
  <!-- Hair - Messy gray -->
  <path d="M150 100 Q150 60 200 55 Q250 60 250 100 L250 90 Q250 70 200 65 Q150 70 150 90 Z" fill="#718096"/>
  
  <!-- Eyes - Angry squint -->
  <path d="M170 115 L190 110 L170 120 Z" fill="#2d3748"/>
  <path d="M230 115 L210 110 L230 120 Z" fill="#2d3748"/>
  
  <!-- Frown -->
  <path d="M175 145 Q200 135 225 145" fill="none" stroke="#2d3748" stroke-width="3"/>
  
  <!-- Name -->
  <text x="200" y="375" font-family="Arial, sans-serif" font-size="20" fill="#ecc94b" text-anchor="middle" font-weight="bold">EL BACHE</text>
  <text x="200" y="395" font-family="Arial, sans-serif" font-size="12" fill="#a0aec0" text-anchor="middle">Don Bacho</text>
</svg>